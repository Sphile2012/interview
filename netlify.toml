[build]
  command   = "pip install -r netlify/functions/requirements.txt -t netlify/functions/packages --upgrade"
  functions = "netlify/functions"
  publish   = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = [
    "templates/**",
    "static/**",
    "app.py"
  ]

# Static assets served directly from the publish dir
[[redirects]]
  from   = "/static/*"
  to     = "/static/:splat"
  status = 200

# Root goes to Flask function
[[redirects]]
  from   = "/"
  to     = "/.netlify/functions/app"
  status = 200
  force  = true

# All other pages go to Flask function
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
  force  = true
