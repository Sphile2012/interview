[build]
  publish   = "static-site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from   = "/booking"
  to     = "/booking.html"
  status = 200

[[redirects]]
  from   = "/services"
  to     = "/services.html"
  status = 200

[[redirects]]
  from   = "/about"
  to     = "/about.html"
  status = 200

[[redirects]]
  from   = "/contact"
  to     = "/contact.html"
  status = 200

[[redirects]]
  from   = "/terms"
  to     = "/terms.html"
  status = 200

[[redirects]]
  from   = "/privacy"
  to     = "/privacy.html"
  status = 200

[[redirects]]
  from   = "/confirmation"
  to     = "/confirmation.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
