[build]
  command   = "pip install -r requirements.txt -t netlify/functions/packages && pip install serverless-wsgi -t netlify/functions/packages"
  functions = "netlify/functions"
  publish   = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = [
    "app.py",
    "templates/**",
    "static/**"
  ]

# Serve static files directly without going through function
[[redirects]]
  from   = "/static/*"
  to     = "/static/:splat"
  status = 200

# Send everything else to the Flask function
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
  force  = true
