[build]
  # The serverless function lives in netlify/functions/
  # No static build step needed — Python is handled at runtime
  command   = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish   = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

# Redirect every URL to the Flask serverless function
# This makes the site behave like a normal multi-page app
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app/:splat"
  status = 200

[functions]
  # Tell Netlify which Python packages to include with the function
  included_files = ["templates/**", "static/**"]
