[build]
  command   = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish   = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app/:splat"
  status = 200

[functions]
  included_files = ["templates/**", "static/**", "barbershop.db"]
