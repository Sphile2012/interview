[build]
  command   = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish   = "static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["templates/**", "static/**"]

# Route every request through the Flask serverless function
[[redirects]]
  from   = "/static/*"
  to     = "/static/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/app"
  status = 200
  force  = true
